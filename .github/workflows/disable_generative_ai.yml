name: Update Notebooks with Colab Metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add Colab metadata
        run: python .github/scripts/add_colab_metadata.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add Colab metadata to notebooks"
          branch: update-notebooks
          title: "Add Colab metadata to notebooks"
          body: "Automatically added missing Colab metadata."
          base: main

      - name: Auto merge PR
        run: |
          gh pr merge update-notebooks --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}